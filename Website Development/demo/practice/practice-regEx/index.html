<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Flower Order Form</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styleSheets/index.css">
    </head>

    <body>
        <header>
            <h1>Flower Order Form</h1>
        </header>

        <main>
            <form name="flowerForm" action="http://itins3.madisoncollege.edu/echo.php" method="post">
                <label>What type of flower whould you like?</label>
                <select name="flower">
                    <option value="none">--Select a Flower--</option>
                    <option value="rose">Roses</option>
                    <option value="lilly">Lillies</option>
                    <option value="carnation">Carnations</option>
                    <option value="sunflower">Sunflowers</option>
                </select>

                <label for="quantity">How many flowers?</label>
                <input type="text" name="quantity" id="quantity" required>

                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>

                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" required>

                <label for="street">Street Address</label>
                <input type="text" name="street" id="street" required>

                <label for="state">State</label>
                <input type="text" name="state" id="state" required>

                <label for="city">City</label>
                <input type="text" name="city" id="city" required>

                <label for="zip">Zip</label>
                <input type="text" name="zip" id="zip" required>

                <div id="buttonContainer">
                    <input type="submit">
                    <input type="reset">
                </div>
            </form>
        </main>
    </body>
</html>
